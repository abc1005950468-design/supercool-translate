name: Bug report
description: 报告可复现问题
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: nubia NX769J / Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: 3.5 / versionCode 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先删除 API Key、个人数据和隐私内容
